name: Validate skill package

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate package structure
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("technical-communication")
          required = {
              root / "SKILL.md",
              root / "agents" / "openai.yaml",
              root / "references" / "rules.en.md",
              root / "references" / "rules.ru.md",
              root / "references" / "formats.en.md",
              root / "references" / "formats.ru.md",
              Path("README.md"),
              Path("README.ru.md"),
              Path("CONTRIBUTING.md"),
              Path("CONTRIBUTING.ru.md"),
          }
          missing = sorted(str(path) for path in required if not path.is_file())
          if missing:
              raise SystemExit(f"Missing required files: {', '.join(missing)}")

          skill = (root / "SKILL.md").read_text(encoding="utf-8")
          if skill.splitlines()[:2] != ["---", "name: technical-communication"]:
              raise SystemExit("SKILL.md has invalid frontmatter")

          content = "\\n".join(
              path.read_text(encoding="utf-8").lower()
              for path in root.rglob("*.md")
          )
          forbidden = ("kwork", "ilya's style", "иля's стиль")
          present = [term for term in forbidden if term in content]
          if present:
              raise SystemExit(f"Legacy scope leaked into skill files: {', '.join(present)}")

          print("Skill package structure and scope are valid.")
          PY
